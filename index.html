<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Spot</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    width:100%;
    overflow:hidden;
    background:#000433;
  }
  body {
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .frame {
    position:relative;
    width:100vw;
    height:calc(100vw * 1080 / 1920);
    max-height:100vh;
    max-width:calc(100vh * 1920 / 1080);
    line-height:0;
  }

  .frame img {
    height:100%;
    width:100%;
    display:block;
  }

  .hotspot {
    position:absolute;
    top:53.8%;
    height:21%;
    border-radius:14px;
    transition: box-shadow 0.15s ease, transform 0.1s ease;
  }

  .hotspot:active { transform: scale(0.97); }

  .hotspot-left {
    left:2.9%;
    width:45.7%;
  }
  .hotspot-left:hover {
    box-shadow: 0 0 0 3px rgba(26,124,255,0.9), 0 0 24px rgba(26,124,255,0.7);
  }

  .hotspot-right {
    left:51.5%;
    width:45.4%;
  }
  .hotspot-right:hover {
    box-shadow: 0 0 0 3px rgba(214,26,43,0.9), 0 0 24px rgba(214,26,43,0.7);
  }
</style>
</head>
<body>

  <div class="frame">
    <img src="gamespot.png" alt="Game Spot">
    <a class="hotspot hotspot-left" href="https://gamesp0t.github.io/PS4/" aria-label="Soft 9,00 الى 11,02"></a>
    <a class="hotspot hotspot-right" href="https://ps4-b1.github.io/b1/" aria-label="Soft 11,50 الى 13,00"></a>
  </div>

</body>
</html>
