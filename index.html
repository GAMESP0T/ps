<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Spot</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background:#050b1a;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }

  .frame {
    position:relative;
    width:100%;
    max-width:620px;
    line-height:0;
  }

  .frame img {
    width:100%;
    display:block;
    border-radius:14px;
  }

  .hotspot {
    position:absolute;
    top:53.6%;
    height:14.5%;
    border-radius:10px;
    transition: box-shadow 0.15s ease, transform 0.1s ease;
  }

  .hotspot:active { transform: scale(0.97); }

  .hotspot-left {
    left:2%;
    width:46.5%;
  }
  .hotspot-left:hover {
    box-shadow: 0 0 0 3px rgba(26,124,255,0.9), 0 0 20px rgba(26,124,255,0.7);
  }

  .hotspot-right {
    left:51.3%;
    width:46.5%;
  }
  .hotspot-right:hover {
    box-shadow: 0 0 0 3px rgba(214,26,43,0.9), 0 0 20px rgba(214,26,43,0.7);
  }
</style>
</head>
<body>

  <div class="frame">
    <img src="gamespot.png" alt="Game Spot">
    <a class="hotspot hotspot-left" href="https://gamesp0t.github.io/PS4/" aria-label="Soft 9,00 الى 11,02"></a>
    <a class="hotspot hotspot-right" href="https://gamesp0t.github.io/GS/" aria-label="Soft 11,50 الى 13,00"></a>
  </div>

</body>
</html>
